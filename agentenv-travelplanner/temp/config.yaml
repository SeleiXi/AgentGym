environment:
  name: "TravelPlanner"
  version: "1.0.0"
  description: "Travel planning environment for language agents"

data:
  dataset_name: "osunlp/TravelPlanner"
  split: "validation"
  data_len: 180

agent:
  model: "gpt-3.5-turbo-1106"
  max_steps: 30
  tools:
    - "FlightSearch"
    - "AccommodationSearch" 
    - "RestaurantSearch"
    - "AttractionSearch"
    - "GoogleDistanceMatrix"
    - "CitySearch"
    - "NotebookWrite"
    - "Planner"

evaluation:
  commonsense_constraints:
    - "is_valid_information_in_current_city"
    - "is_valid_information_in_sandbox"
    - "is_reasonable_visiting_city"
    - "is_valid_restaurants"
    - "is_valid_transportation"
    - "is_valid_attractions"
    - "is_valid_accommodation"
    - "is_not_absent"
  
  hard_constraints:
    - "valid_cost"
    - "valid_room_rule"
    - "valid_cuisine"
    - "valid_room_type"
    - "valid_transportation"

server:
  timeout: 300
  host: "localhost"
  port: 8080 