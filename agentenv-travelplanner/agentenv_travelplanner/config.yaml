# TravelPlanner Environment Configuration

# Server settings
server:
  host: "127.0.0.1"
  port: 59399
  workers: 1
  log_level: "info"
  debug: false

# Environment settings
environment:
  max_steps: 30
  max_environments: 100
  timeout_seconds: 300

# Dataset settings
dataset:
  name: "osunlp/TravelPlanner"
  split: "validation"
  fallback_to_mock: true
  mock_size: 10

# Tools configuration
tools:
  available:
    - "FlightSearch"
    - "AccommodationSearch"
    - "RestaurantSearch"
    - "AttractionSearch"
    - "GoogleDistanceMatrix"
    - "CitySearch"
    - "NotebookWrite"
    - "Planner"
  
  # Mock data settings
  mock_responses: true
  response_delay: 0.1  # seconds
  timeout: 30  # seconds
  retry_limit: 3
  
  # Individual tool settings
  flight:
    enabled: true
  accommodation:
    enabled: true
  restaurant:
    enabled: true
  attraction:
    enabled: true
  distance:
    enabled: true
  city:
    enabled: true
  notebook:
    enabled: true
  planner:
    enabled: true

# Reward settings
rewards:
  base_reward: 0.1
  tool_use_reward: 0.2
  notebook_reward: 0.1
  planner_reward: 0.5
  error_penalty: -0.3
  success_reward: 100.0
  step_penalty: -0.1
  failure_penalty: -10.0

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null  # Set to file path to log to file

# API settings
api:
  max_request_size: 1048576  # 1MB
  timeout: 30
  rate_limit: 100  # requests per minute
  
  # API configurations for various tools
  openai:
    api_key: null  # Set your OpenAI API key
    model: "gpt-3.5-turbo"
  
  google:
    api_key: null  # Set your Google API key

# Model configurations 
models:
  react_llm_name: "gpt-3.5-turbo"
  planner_llm_name: "gpt-3.5-turbo"

# Agent configuration
agent:
  mode: "two_stage"  # two_stage or sole_planning
  strategy: "direct"  # direct, react, reflexion
  verbose: true

# Travel planning parameters
travel:
  max_duration: 7      # Maximum travel days
  max_budget: 10000    # Maximum budget
  people_number: 2     # Number of travelers
  
  # Default planning preferences
  preferences:
    transportation: "any"
    accommodation: "any"
    cuisine: "any"
    activities: ["sightseeing"] 